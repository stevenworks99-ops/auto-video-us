name: Auto US Video Agent

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build_video:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil Kode
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Alat
        run: pip install -r requirements.txt

      - name: Buat Video Kualitas Studio
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python agent.py

      - name: Simpan Hasil Video
        uses: actions/upload-artifact@v4
        with:
          name: daily-us-short
          path: |
            final_video.mp4
            caption.txt
